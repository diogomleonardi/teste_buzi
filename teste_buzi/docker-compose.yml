services:

  # ── Ollama (IA local) ────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: jurisai_ollama
    restart: unless-stopped
    gpus: all
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Backend FastAPI ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jurisai_backend
    restart: unless-stopped
    environment:
      # Ollama — aponta para o container ollama na rede interna do Docker
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3:8b
      # Segurança — troque em produção!
      SECRET_KEY: ${SECRET_KEY:-changeme-replace-in-production}
      # Banco de dados
      DATABASE_URL: sqlite:////data/juridico.db
      # Upload
      UPLOAD_DIR: /data/uploads
      MAX_FILE_SIZE: "10485760"
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── Frontend React/Nginx ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jurisai_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ollama_data:
  backend_data: